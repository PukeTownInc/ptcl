name: TypeScript check

on:
  push:
    branches:
      - fix/login-profile-loading-safety
      - redesign/puketown-visual-system
  pull_request:
    branches:
      - main
      - fix/login-profile-loading-safety
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript check
        run: npm run typecheck
